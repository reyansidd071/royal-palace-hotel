<!DOCTYPE html>
<html>
<head>
    <title>Royal Palace Hotel - Contact</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>Royal Palace Hotel</h1>

    <nav>
        <a href="index.html">Home</a>
        <a href="rooms.html">Rooms</a>
        <a href="about.html">About</a>
        <a href="gallery.html">Gallery</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>

<main>

<section id="contact">

    <h2 style="color: red; font-size: 36px; font-family: Georgia, 'Times New Roman', Times, serif; letter-spacing: 2px;">
        Contact Us
    </h2>

    <div class="contact-box">

        <p>Phone: <a href="tel:+923113618081">+92 311 3618081</a></p>

        <p>Email: <a href="mailto:reyansidd071@gmail.com">reyansidd071@gmail.com</a></p>

        <p>Address: Sukkur, Pakistan</p>

        <form class="booking-form" onsubmit="sendToWhatsApp(event)">

            <input type="text" id="name" placeholder="Your Name" required>

            <input type="email" id="email" placeholder="Your Email" required>

            <input type="tel" id="phone" placeholder="Phone Number" required>

            <input type="date" id="date" required>

            <select id="room" required>
                <option value="">Select Room</option>
                <option>Deluxe Room</option>
                <option>Executive Room</option>
                <option>Presidential Suite</option>
            </select>

            <textarea id="message" placeholder="Your Message"></textarea>

            <button type="submit">
                Book Now
            </button>

        </form>

    </div>

</section>

</main>

<footer>
    <p>© 2026 Royal Palace Hotel. All Rights Reserved.</p>
</footer>

<script>
function sendToWhatsApp(event) {
    event.preventDefault();

    const name = document.getElementById("name").value;
    const email = document.getElementById("email").value;
    const phone = document.getElementById("phone").value;
    const date = document.getElementById("date").value;
    const room = document.getElementById("room").value;
    const message = document.getElementById("message").value;

    const whatsappMessage =
        "Hello Royal Palace Hotel!" +
        "\nName: " + name +
        "\nEmail: " + email +
        "\nPhone: " + phone +
        "\nDate: " + date +
        "\nRoom: " + room +
        "\nMessage: " + message;

    const whatsappURL =
        "https://wa.me/923113618081?text=" +
        encodeURIComponent(whatsappMessage);

    window.open(whatsappURL, "_blank");
}
</script>

</body>
</html>
